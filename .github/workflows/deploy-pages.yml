name: Deploy static site to GitHub Pages (with runtime env)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy directory and copy site files
        run: |
          # create deploy dir and copy repo files except .github, .git and deploy
          mkdir -p deploy
          rsync -av --exclude='.github' --exclude='.git' --exclude='deploy' . deploy/

      - name: Create runtime env file (deploy/env.js)
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          mkdir -p deploy
          cat > deploy/env.js <<'EOF'
          window._env_ = {
            API_URL: "${API_URL}"
          };
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./deploy

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
